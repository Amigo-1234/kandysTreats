<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kandys Treats — Super Admin</title>

  <!-- MAIN APP STYLES -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="super-admin.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e84c88">
  <meta name="apple-mobile-web-app-capable" content="yes">

    <div class="sidebar-footer">
      <button id="super-logout" class="btn btn-outline btn-sm">
        Logout
      </button>
    </div>

    <header class="dashboard-header glass-card">
      <div>
        <h1 id="dashboard-title">Overview</h1>
        <p class="muted">Owner finance & transaction control</p>
      </div>

      <a href="admin.html" class="btn btn-ghost">

    </header>

    <!-- CONTENT -->
    <main class="dashboard-content">

      <!-- ===== OVERVIEW ===== -->
  <!-- OVERVIEW -->

  <!-- TRANSACTIONS -->
  <section class="dashboard-view hidden" data-view="transactions">
    <!-- transactions table -->
  </section>

  <!-- ANNOUNCEMENTS -->
  <section class="dashboard-view hidden" data-view="announcements">
    <!-- announcements UI -->
  </section>

  <!-- EXPORTS -->
  <section class="dashboard-view hidden" data-view="exports">
    <!-- export CSV button -->
  </section>

</div>

      <!-- ===== TRANSACTIONS ===== -->

        <!-- 🔁 move your transactions section here -->
        <!-- search, filters, table stays the same -->

      </section>

      <!-- ===== ANNOUNCEMENTS ===== -->
      <section class="dashboard-view hidden" data-view="announcements">

        <!-- 🔁 move your announcements section here -->

      </section>

      <!-- ===== EXPORT ===== -->
      <section class="dashboard-view hidden" data-view="export">

        <button id="export-csv" class="btn btn-primary">
          Export CSV
        </button>

      </section>

    </main>

  <!-- MODAL (UNCHANGED) -->
  <div id="order-modal" class="modal-overlay hidden">
    <div class="modal glass-card">
      <div class="modal-header">
        <h3 id="modal-order-id">Order</h3>
        <button id="close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/super-admin.js"></script>
</body>
</html>
