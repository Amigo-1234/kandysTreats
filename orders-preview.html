<!DOCTYPE html>
<html lang="en" data-page="preview">
<head>
  <meta charset="UTF-8" />
  <title>Review Orders | Kandys Treats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />

  <meta name="theme-color" content="#e84c88">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body class="page page-preview">

<div id="announcement-bar" class="top-announcement">
  <div class="announcement-viewport">
    <div class="announcement-track">
    <span class="announcement-content">Welcome to Kandys Treats 🍭</span>
    <span class="announcement-content">Welcome to Kandys Treats 🍭</span>
  </div>
  </div>
  </div>

    <section id="draft-orders" class="draft-orders"></section>

    <p id="no-drafts" class="empty-state" hidden>

      <div class="summary-row">
        <span>Total to pay</span>

      <button
        id="proceed-payment"
        class="btn btn-primary btn-block">

      </button>

      <a href="cart.html" class="btn btn-outline btn-block">
        Add more orders
