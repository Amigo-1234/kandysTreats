<!DOCTYPE html>
<html lang="en" data-page="quick-picks">
<head>
  <meta charset="UTF-8" />
  <title>Quick Picks | Kandys Treats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />

  <style>
    .qp-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .qp-layout {
        grid-template-columns: 1fr;
      }
    }

    /* FOOD GRID */
    .qp-food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .qp-food-card {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .qp-food-card.active {
      border-color: #e84c88;
      background: rgba(232,76,136,0.18);
    }

    .qp-food-card h4 {
      margin: 0 0 6px;
      font-size: 14px;
    }

    .qp-food-card small {
      opacity: 0.7;
    }

    .qp-qty {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .qp-qty button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: #e84c88;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    /* SUMMARY */
    .qp-summary {
      position: sticky;
      top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .qp-summary h3 {
      margin-top: 0;
    }

    .qp-summary ul {
      padding-left: 16px;
      margin: 10px 0;
    }

    .qp-summary li {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .valentine-tag {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body class="page page-admin">
<div class="page-shell">

  <header class="section">
    <div class="section-header inline">
      <div>
        <h1>Quick Picks</h1>
        <p class="muted">Build combos visually — tap to add food</p>
      </div>
      <a href="menu-builder.html" class="btn btn-ghost btn-sm">
        ← Back
      </a>
    </div>
  </header>

  <main class="section qp-layout">

    <!-- LEFT: FOOD PICKER -->
    <section class="glass-card">
      <input id="qp-title" placeholder="Combo name (e.g. Valentine Lovers Pack)" />
      <input id="qp-desc" placeholder="Short description" />
      <input id="qp-image" placeholder="Image URL" />

      <label class="valentine-tag">
        <input type="checkbox" id="qp-valentine">
        ❤️ Valentine Special
      </label>

      <h3 style="margin-top:20px">Pick foods</h3>
      <div id="qp-food-grid" class="qp-food-grid"></div>
    </section>

    <!-- RIGHT: SUMMARY -->
    <aside class="qp-summary">
  <h3>Saved Quick Picks</h3>

  <div id="qp-items" class="qp-saved-list"></div>
</aside>

  </main>

</div>

<script src="app.js" type="module"></script>
<script src="js/quickpicks.js" type="module"></script>
</body>
</html>
