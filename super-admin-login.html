<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Login — Kandys</title>

  <link rel="stylesheet" href="super-admin.css" />
</head>

<body class="auth-page">

  <div class="auth-wrapper">

    <div class="auth-card glass-card">

      <div class="auth-header">
        <h1>Kandys</h1>
        <p class="muted">Super Admin Access</p>
      </div>

      <form id="login-form" class="auth-form">

        <div class="field">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="admin@kandys.com"
            required
          />
        </div>

        <div class="field">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />
        </div>

        <button class="btn btn-primary btn-block">
          Login
        </button>

        <p class="auth-hint muted">
          Authorized personnel only
        </p>

      </form>

    </div>

  </div>

  <script type="module" src="js/super-admin-login.js"></script>
</body>
</html>
