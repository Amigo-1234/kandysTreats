<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Super Admin — Exports</title>
  <link rel="stylesheet" href="super-admin.css" />
</head>

<body class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>Kandys</h2>
      <span>Super Admin</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html">Overview</a>
      <a class="nav-item" href="transactions.html">Transactions</a>
      <a class="nav-item" href="announcements.html">Announcements</a>
      <a class="nav-item is-active" href="exports.html">Exports</a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-outline" id="logout-btn">Logout</button>

      <button class="btn btn-outline"> <a href="admin.html" style="color: white; text-decoration: none;">Staff Page</a> </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="dashboard-main">

    <header class="dashboard-header">
      <div>
        <h1>Exports</h1>
        <p>Download business data</p>
      </div>
    </header>

    <main class="dashboard-content">

      <!-- EXPORT OPTIONS -->
      <div class="card export-card">
        <h3>Export Data</h3>

        <div class="export-grid">

          <div class="export-box">
            <h4>Orders</h4>
            <p>All completed & pending orders</p>
            <button class="btn btn-primary" id="export-orders">
              Export CSV
            </button>
          </div>

          <div class="export-box">
            <h4>Transactions</h4>
            <p>Payments & revenue records</p>
            <button class="btn btn-primary" id="export-transactions">
              Export CSV
            </button>
          </div>

          <div class="export-box">
            <h4>Customers</h4>
            <p>Customer names & phone numbers</p>
            <button class="btn btn-primary" id="export-customers">
              Export CSV
            </button>
          </div>

        </div>
      </div>

      <!-- CUSTOM EXPORT -->
      <div class="card export-card">
        <h3>Custom Export</h3>

        <div class="export-filters">
          <select id="range-select">
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="month">This month</option>
            <option value="all">All time</option>
          </select>

          <select id="type-select">
            <option value="transactions">Transactions</option>
            <option value="orders">Orders</option>
            <option value="customers">Customers</option>
          </select>

          <button class="btn btn-primary" id="export-custom">
            Download
          </button>
        </div>

        <p class="muted">
          Choose date range and data type before exporting
        </p>
      </div>

    </main>
  </div>

  <script type="module" src="js/exports.js"></script>
</body>
</html>
