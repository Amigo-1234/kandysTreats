<!DOCTYPE html>
<html lang="en" data-page="menu">
<head>
  <meta charset="UTF-8" />
  <title>Menu | Kandys Treats Eatery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="styles.css" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e84c88">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="page page-menu">

  <div id="announcement-bar" class="top-announcement">
  <div class="announcement-viewport">
    <div class="announcement-track">
    <span class="announcement-content">Welcome to Kandys Treats 🍭</span>
    <span class="announcement-content">Welcome to Kandys Treats 🍭</span>
  </div>
  </div>
  </div>


  <div id="app-loader">
  <div class="loader-ring"></div>
</div>

  <div class="page-shell">
    <header class="section menu-hero fade-in-up">
      <h1>Explore the Menu</h1>
      <p>All your favourites, tuned for late-night cravings.</p>
      <div class="menu-search-row">
        <div class="input-wrap">
          <input
            type="search"
            id="menu-search"
            placeholder="Search meals, e.g. Jollof, Pepper Soup…"
            autocomplete="off"
          />
        </div>
        <button class="btn btn-outline btn-sm" id="clear-search">Clear</button>
      </div>
    </header>

    <section class="section fade-in-up delay-1" id="menu-section">
      <div class="menu-tabs" id="menu-tabs">
        <!-- Tabs injected by JS -->
      </div>

      <div class="menu-grid" id="menu-grid" aria-live="polite">
        <!-- Skeleton loaders -->
        <div class="menu-card glass-card skeleton-card">
          <div class="menu-card-image skeleton"></div>
          <div class="menu-card-body">
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
            <div class="skeleton skeleton-pill"></div>
          </div>
        </div>
        <div class="menu-card glass-card skeleton-card">
          <div class="menu-card-image skeleton"></div>
          <div class="menu-card-body">
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
            <div class="skeleton skeleton-pill"></div>
          </div>
        </div>
        <div class="menu-card glass-card skeleton-card">
          <div class="menu-card-image skeleton"></div>
          <div class="menu-card-body">
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
            <div class="skeleton skeleton-pill"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav glass-card">
  <a href="home.html" class="bottom-nav-item" data-page="home">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/>
    </svg>
    <span class="nav-label">Home</span>
  </a>

  <a href="menu.html" class="bottom-nav-item" data-page="menu">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
    <span class="nav-label">Menu</span>
  </a>

  <a href="cart.html" class="bottom-nav-item" data-page="cart">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M6 6h15l-2 9H7z"/>
      <circle cx="9" cy="20" r="1.5"/>
      <circle cx="18" cy="20" r="1.5"/>
    </svg>
    <span class="nav-label">Cart</span>
    <span class="bottom-nav-badge js-cart-count">0</span>
  </a>

  <a href="track.html" class="bottom-nav-item" data-page="track">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M12 21s6-5.3 6-10a6 6 0 1 0-12 0c0 4.7 6 10 6 10z"/>
      <circle cx="12" cy="11" r="2.5"/>
    </svg>
    <span class="nav-label">Track</span>
  </a>
</nav>

  <div class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js" type="module"></script>

</html>
