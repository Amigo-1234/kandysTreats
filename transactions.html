<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin — Transactions</title>

  <link rel="stylesheet" href="super-admin.css" />
  
</head>

<body class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>Kandys</h2>
      <span>Super Admin</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html">Overview</a>
      <a class="nav-item is-active" href="transactions.html">Transactions</a>
      <a class="nav-item" href="announcements.html">Announcements</a>
      <a class="nav-item" href="exports.html">Exports</a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-outline" id="logout-btn">Logout</button>

      <button class="btn btn-outline"> <a href="admin.html" style="color: white; text-decoration: none;">Staff Page</a> </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="dashboard-main">

    <!-- HEADER -->
    <header class="dashboard-header">
      <div>
        <h1>Transactions</h1>
        <p class="muted">All orders & payments</p>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="dashboard-content">

      <!-- STATS -->
      <section class="card-grid">
        <div class="card stat-card">
          <span class="stat-label">Total Transactions</span>
          <h2 class="stat-value" id="stat-total">—</h2>
        </div>

        <div class="card stat-card">
          <span class="stat-label">Revenue (30 days)</span>
          <h2 class="stat-value" id="stat-revenue">—</h2>
        </div>

        <div class="card stat-card">
          <span class="stat-label">Average Order</span>
          <h2 class="stat-value" id="stat-average">—</h2>
        </div>
      </section>

      <!-- CHART -->
      <section class="card chart-card">
        <div class="chart-header">
          <h3>Revenue Overview</h3>
          <div class="chart-filters">
            <button class="is-active" data-range="7">7 days</button>
            <button data-range="30">30 days</button>
            <button data-range="365">12 months</button>
          </div>
        </div>

        <div class="chart-placeholder">
  <canvas id="revenueChart"></canvas>
</div>

        <p class="muted chart-hint">Revenue trend based on completed orders</p>
      </section>

      <!-- SEARCH -->
      <input
        type="text"
        id="search-input"
        placeholder="Search by order ID..."
        style="margin:18px 0;padding:10px;border-radius:10px;width:100%"
      />

      <!-- TABLE -->
      <section class="card table-card">
        <h3>All Transactions</h3>

        <div class="transactions-header">
          <span>Order ID</span>
          <span>Date</span>
          <span>Customer</span>
          <span>Amount</span>
          <span>Status</span>
          <span>Paid</span>
        </div>

        <div id="transactions-body"></div>
      </section>

    </main>
  </div>

  <!-- MODAL -->
  <div id="order-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-order-id"></h3>
      <div id="modal-content"></div>
      <button class="btn btn-outline" id="close-modal">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="js/transactions.js"></script>
</body>
</html>
